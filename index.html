<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3d6e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Health App">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Health App</title>
<style>
:root{--b:#0f3d6e;--b2:#1f6fb5;--bg:#f3f6fa;--ln:#d5deea;--tx:#17283d;--mu:#5d6f86;--red:#b3261e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,'Segoe UI',Roboto,sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
header{flex:none;background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--b);display:grid;place-items:center;font-weight:700;font-size:1.25rem;flex:none}
header h1{margin:0;font-size:1.15rem;line-height:1.2}header small{display:block;opacity:.88;font-size:.82rem}
.chip{margin-left:auto;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:4px 12px;font-size:.8rem;text-align:center}
.wrap{flex:1;display:flex;min-height:0}
nav{width:236px;flex:none;background:#fff;border-right:1px solid var(--ln);overflow-y:auto;padding:6px 0}
nav button{display:flex;width:100%;gap:10px;align-items:center;padding:11px 16px;border:0;border-left:4px solid transparent;background:none;font:inherit;color:var(--tx);text-align:left;cursor:pointer}
nav button.on{background:#e8f0fa;border-left-color:var(--b2);font-weight:600;color:var(--b)}
nav button.sos{color:var(--red);font-weight:700}nav button.sos.on{background:#fdecea;border-left-color:var(--red)}
nav .ic{width:22px;text-align:center;flex:none}nav .sh{display:none}nav .n{margin-left:auto;font-size:.75rem;color:var(--mu)}
nav hr{border:0;border-top:1px solid var(--ln);margin:6px 0}
main{flex:1;min-width:0;overflow-y:auto;padding:16px 18px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.bar h2{margin:0 auto 0 0;font-size:1.25rem;color:var(--b)}
.btn{background:var(--b2);color:#fff;border:1px solid var(--b2);border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:#fff;color:var(--b);border-color:var(--ln)}.btn.r{background:#fff;color:var(--red);border-color:var(--red)}
.auto{font-size:.85rem;color:var(--mu);display:flex;gap:6px;align-items:center;flex-direction:row;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--ln);border-radius:6px;overflow:hidden;cursor:pointer}
.card .th{height:130px;background:#e8eef6;display:grid;place-items:center;color:var(--b);font-weight:700;font-size:1.3rem}
.card .th img{width:100%;height:100%;object-fit:cover}
.card .in{padding:8px 10px;border-top:1px solid var(--ln)}.card b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--mu);font-size:.78rem}
.empty{border:2px dashed var(--ln);background:#fff;border-radius:6px;padding:28px;color:var(--mu);text-align:center}
.warn{background:#fff7e0;border:1px solid #e6c458;border-radius:6px;padding:12px 14px;margin-bottom:14px}
.mu{color:var(--mu);font-size:.85rem}
.form{max-width:520px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.88rem}
input[type=text],input[type=date],input[type=password],select,textarea{font:inherit;border:1px solid var(--ln);border-radius:6px;padding:9px 10px;background:#fff;color:var(--tx);width:100%}
/* emergency card sheet */
.sheet{background:#fff;border:2px solid var(--red);border-radius:6px;max-width:820px}
.sheet h3{margin:0;background:var(--red);color:#fff;padding:10px 16px;font-size:1.1rem}
.sheet h4{margin:0;padding:6px 16px;background:#f3f6fa;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);font-size:.9rem;color:var(--b)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;padding:8px 16px}.kv span{color:var(--mu)}.kv b{font-weight:600;word-break:break-word}
.sheet table{width:calc(100% - 32px);margin:8px 16px;border-collapse:collapse;font-size:.9rem}
.sheet th,.sheet td{border:1px solid var(--ln);padding:5px 8px;text-align:left}.sheet th{background:#f3f6fa}
.sheet a{color:var(--b2)}
#modal{position:fixed;inset:0;background:rgba(10,30,60,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}#modal.on{display:flex}
.box{background:#fff;border-radius:8px;width:min(900px,100%);max-height:94vh;overflow:auto}
.box h3{margin:0;padding:10px 16px;background:var(--b);color:#fff;font-size:1.05rem}.box .mb{padding:14px 16px;display:grid;gap:12px}
.box .pv{background:#e8eef6;border:1px solid var(--ln);text-align:center;min-height:80px;display:grid;place-items:center;color:var(--mu)}.box .pv img{max-width:100%;max-height:60vh}.box .pv iframe{width:100%;height:60vh;border:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--b);color:#fff;padding:9px 18px;border-radius:99px;display:none;z-index:30;max-width:92vw;text-align:center}
@media(max-width:700px){
nav{width:70px}nav button{flex-direction:column;gap:2px;padding:10px 2px;border-left-width:3px;text-align:center;font-size:.62rem;line-height:1.1}
nav .full,nav .n{display:none}nav .sh{display:block}nav .ic{font-size:1.2rem}
.chip{display:none}main{padding:12px}.row2{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:105px 1fr}}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dc{background:#fff;border:1px solid var(--ln);border-radius:6px;padding-top:10px}.dc>b,.dc>.mu{display:block;padding:0 16px}.dc .kv{grid-template-columns:70px 1fr}
.rh{margin:12px 0 4px;color:var(--b)}.res{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:14px 16px;max-width:820px;overflow-wrap:anywhere}
@media print{header,nav,.bar,#toast{display:none!important}body{display:block;overflow:visible;background:#fff}.wrap,main{display:block;overflow:visible;padding:0}.sheet{border:1px solid #000;max-width:none}.sheet h3{background:#fff;color:#000;border-bottom:2px solid #000}}

@page{margin:1cm}
.qrbox{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ln)}
.qri svg{width:140px;height:140px;display:block}
.qrbox pre{margin:6px 0 0;white-space:pre-wrap;font:inherit;font-size:.85rem;background:#f3f6fa;padding:6px 8px;border-radius:6px;word-break:break-word}
#qrsheet{display:flex;flex-wrap:wrap}
.stk{width:5.5cm;height:6.5cm;border:1px dashed #888;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.2cm;break-inside:avoid;background:#fff;gap:2px}
.stk .qri svg{width:3.8cm;height:3.8cm}.stk .sos{color:var(--red);font-weight:800;letter-spacing:.06em}.stk small{font-size:.72rem;color:#333;line-height:1.25}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--ln);border-radius:6px}
table.ft,table.an{border-collapse:collapse;width:100%;font-size:.88rem}
.ft th,.ft td,.an th,.an td{border-bottom:1px solid var(--ln);padding:8px 10px;text-align:left;vertical-align:top}
.ft th,.an th{background:#f3f6fa;color:var(--b);white-space:nowrap}
.ft tr[onclick]{cursor:pointer}.ft tr[onclick]:hover{background:#f7fafd}
.ft img{width:36px;height:36px;object-fit:cover;border-radius:4px;display:block}
.tag{display:inline-block;border-radius:99px;padding:3px 11px;font:inherit;font-size:.78rem;font-weight:700;border:0;cursor:pointer}
.tag.a{background:#e3f4e6;color:#1b6b2e}.tag.i{background:#eceff3;color:#5d6f86}
footer{flex:none;background:#fff;border-top:1px solid var(--ln);padding:6px 14px calc(6px + env(safe-area-inset-bottom));font-size:.78rem;color:var(--mu);display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap;overflow:hidden}footer span{overflow:hidden;text-overflow:ellipsis}footer i{width:10px;height:10px;border-radius:50%;background:#9aa7b8;flex:none}footer.ok i{background:#1fa64a}footer.ok b{color:#1b6b2e}footer.off i,footer.none i{background:#d93025}footer.off b,footer.none b{color:#b3261e}footer.wait i{background:#f0a500}@media print{footer{display:none!important}}.cs{width:auto}.qri.big svg{width:230px;height:230px;max-width:100%}.sheet ul{margin:6px 0;padding:0 16px 6px 34px}.sheet p{margin:6px 16px}
#mim{display:grid;gap:12px}
@media print{body:not(.qrp) #qrsheet,body:not(.qrp) .qtools{display:none!important}body.qrp .sheet,body.qrp p.mu{display:none!important}}
</style></head><body>
<header><div class="av" id="av"></div><div><h1 id="hn"></h1><small id="ha"></small></div><div class="chip" id="hd"></div></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<footer id="ft"></footer>
<input id="fs" type="file" accept="image/*" capture="environment" hidden>
<input id="fu" type="file" accept="image/*,application/pdf" multiple hidden>
<div id="modal"></div><div id="toast"></div>

function RP(k,cs){const base=`You are helping a family in Pakistan follow medical research from all over the world about a child's condition. Case (no name given):\n${cs}\n\nUse web search. Prefer peer-reviewed papers, clinical guidelines, ClinicalTrials.gov, regulators and major children's or cancer centres. For every item give the year and a full link on its own line. State the evidence level plainly (randomised trial, cohort, case report, lab study, expert opinion). Never give doses and never tell the family to start, stop or change any treatment; everything is for discussion with her treating doctors. Plain English, short bullets, under 500 words. End with one line saying what to ask her doctors.\n\nTask: `;
const T={studies:'Find the most recent studies and reviews (last two years first) on this condition: outcomes, long-term follow-up, hormone, vision and growth problems, quality of life.',
treat:'Summarise current treatment approaches used around the world (surgery, radiotherapy including proton therapy, targeted therapy, hormone replacement and others) and list notable clinical trials that are recruiting now, with links. Say which approach depends on tumour type or age.',
new:'List new medicines or approaches reported in the last two years for this condition or its complications (hormone problems, hypothalamic weight gain, vision, bone growth). Give the stage of development, approval status, and availability in Pakistan or the UAE if you can find it.',
homeo:'What do published studies say about homeopathy and other traditional or alternative medicine (herbal, Unani, Ayurvedic) for brain or pituitary-region tumours like this? Report honestly: how many studies, their quality, whether any show benefit, safety concerns, and the danger of delaying proven treatment. If there is no good evidence, say so clearly. List any homeopathic or herbal medicines named in studies or case reports (names only, no dosage) with the evidence level for each.',
meds:'For each current medicine in the case, summarise what recent research says about long-term use in children, side effects to watch for, and important interactions. If no medicines are listed, say so.'};
return base+T[k]}

const GAPI='https://generativelanguage.googleapis.com/v1beta/';
async function gList(){if(gl)return gl;let j;try{const r=await fetch(GAPI+'models?pageSize=200',{headers:{'x-goog-api-key':cfg.key}});j=await r.json()}catch(e){throw new Error('No internet, or Google could not be reached')}
if(j.error)throw new Error(/API key|API_KEY/i.test(JSON.stringify(j.error))?'The Gemini key is not valid. Copy it again from aistudio.google.com/app/apikey':(j.error.message||'Gemini error'));
const ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]),ok=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/','')).filter(n=>/^gemini-\d+(\.\d+)?-flash(-lite)?$/.test(n));
ok.sort((a,b)=>(/lite/.test(a)-/lite/.test(b))||ver(b)-ver(a));if(!ok.length)ok.push('gemini-3.8-flash','gemini-3.5-flash-lite','gemini-2.5-flash');
if(cfg.gm&&ok.includes(cfg.gm)){ok.splice(ok.indexOf(cfg.gm),1);ok.unshift(cfg.gm)}return gl=ok}
async function gem(parts,gc,tools){const list=await gList();let last='';
for(let i=0;i<list.length&&i<4;i++){const m=list[i];
for(let t=0;t<2;t++){let j;try{const r=await fetch(GAPI+'models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:gc,...(tools?{tools}:{})})});j=await r.json()}catch(e){throw new Error('No internet, or Google could not be reached')}
if(!j.error){const c=(j.candidates||[])[0];if(!c||!c.content||!(c.content.parts||[]).length){last=(j.promptFeedback&&j.promptFeedback.blockReason)||'Gemini sent an empty answer';break}if(cfg.gm!==m){cfg.gm=m;sv()}return{text:c.content.parts.map(p=>p.text||'').join(''),meta:c.groundingMetadata,model:m}}
const e=j.error,msg=e.message||'Gemini error';last=msg;if(e.code===400&&/API key/i.test(msg))throw new Error('The Gemini key is not valid. Check it in Settings.');
if(e.code===429){const d=(msg.match(/retry in ([\d.]+)s/i)||[])[1];if(t===0&&d&&+d<=40&&!/per.?day/i.test(JSON.stringify(e))){await wait((+d+1)*1000);continue}last='Free limit reached for now ('+m+'). Wait a minute, or try again after midnight Pacific time.'}break}}
throw new Error(last||'Gemini could not answer')}
async function ai(f,type){const part=type==='application/pdf'?{inline_data:{mime_type:'application/pdf',data:await b64(f)}}:{inline_data:{mime_type:'image/jpeg',data:(await img(f,1600,.85)).split(',')[1]}};
const o=await gem([part,{text:PROMPT}],{responseMimeType:'application/json',temperature:0.1,maxOutputTokens:8192}),m=o.text.match(/\{[\s\S]*\}/);if(!m)throw new Error('AI did not return readable details');return JSON.parse(m[0])}
async function addFiles(fl){fl=[...fl];if(!fl.length)return;if(!cfg.url||!cfg.pin){toast('Connect online storage in Settings first');return}
const useAI=cfg.auto&&hasKey();let n=0,ok=0,badAI=0,dd=0,fail='';
if(cfg.auto&&!hasKey())toast('No Gemini key yet: sorting by section and file name');
for(const f of fl){toast('Saving '+(++n)+' of '+fl.length+(useAI?' (AI reading)…':'…'));const type=f.type||(/\.pdf$/i.test(f.name)?'application/pdf':'image/jpeg');let g={};
if(useAI){try{g=await ai(f,type)}catch(e){badAI++}}
const sec=SEC.some(s=>s[0]===g.section)?g.section:(SEC.some(s=>s[0]===cur)?cur:(guess(f.name)||'scan'));const x={};applyAI(x,g);if(!x.c&&gcn(f.name))x.c=gcn(f.name);
const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),sec,title:g.title||f.name.replace(/\.[^.]+$/,''),date:/^\d{4}-\d\d-\d\d$/.test(g.date||'')?g.date:new Date(f.lastModified||Date.now()).toISOString().slice(0,10),note:pack((g.summary||'')+(g.meds&&!x.m?' | Medicines (AI-read, check the original): '+g.meds:''),x),type,name:f.name,thumb:''};
try{let data,blob=f;
if(type==='application/pdf')data=await b64(f);else{try{const full=await img(f,2400,.9);data=full.split(',')[1];r.thumb=await img(f,260,.6);r.type=type='image/jpeg';blob=await (await fetch(full)).blob()}catch(e){data=await b64(f)}}
const j=await api({a:'add',...r,data});r.fid=j.fid;await tx('readwrite',s=>s.put({fid:r.fid,blob}));R.push(r);ok++;if(logDoc(g.doctor,r))dd++}catch(e){fail=e.message}}
if(dd)await pc();snap();render();toast(ok+' of '+fl.length+' saved online'+(dd?' · '+dd+' doctor(s) updated in My doctors':'')+(fail?' · error: '+fail:'')+(badAI?' · '+badAI+' not read by AI':''))}
$('#fu').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#fs').onchange=e=>{addFiles(e.target.files);e.target.value=''};
/* open / edit */
async function openRec(id){const r=R.find(x=>x.id===id),x=X(r),s=sc(r);
$('#modal').innerHTML=`<div class="box"><h3>${esc(r.title)}</h3><div class="mb"><div class="pv" id="pv">Loading file…</div><div class="row2"><label>Title<input type="text" id="m1" value="${esc(r.title)}"></label><label>Date<input type="date" id="m2" value="${esc(r.date)}"></label></div><div class="row2"><label>Section<select id="m3" onchange="mx()">${SEC.map(q=>`<option value="${q[0]}" ${q[0]===s?'selected':''}>${esc(q[1])}</option>`).join('')}</select></label><label>Country<select id="m5"><option value="">— not set —</option>${COUNTRIES.map(c=>`<option ${cn(r)===c?'selected':''}>${c}</option>`).join('')}</select></label></div>
<label id="mrx">Medicines – one per line: Medicine | Formula | Dosage | Used for<textarea id="m6" rows="5">${esc(medsText(x.m||[]))}</textarea></label>
<div id="mim"><label>Scan type<input type="text" id="m7" value="${esc(x.s)}" placeholder="Brain MRI with contrast"></label><label>Result / findings<textarea id="m8" rows="4">${esc(x.f)}</textarea></label></div>
<label>Notes<textarea id="m4" rows="3">${esc(txt(r))}</textarea></label><div class="bar" style="border:0;margin:0;padding:0"><button class="btn" onclick="saveRec('${id}')">Save</button><button class="btn g" onclick="rereadOne('${id}')">🔎 Read with AI</button><a class="btn g" id="dl" style="text-decoration:none" target="_blank">Open / download</a><button class="btn g" onclick="closeM()">Close</button><button class="btn r" style="margin-left:auto" onclick="delRec('${id}')">Delete</button></div></div></div>`;$('#modal').className='on';mx();
try{const b=await getBlob(r),u=U[r.fid]||(U[r.fid]=URL.createObjectURL(b));if(!$('#pv'))return;$('#pv').innerHTML=isPdf(r)?`<iframe src="${u}"></iframe>`:`<img src="${u}" alt="">`;$('#dl').href=u;$('#dl').download=r.name}catch(e){if($('#pv'))$('#pv').textContent='Could not load the file: '+e.message}}
const mx=()=>{const v=$('#m3').value;$('#mrx').hidden=v!=='rx';$('#mim').hidden=!['mri','ct'].includes(v)};
async function rereadOne(id){if(!hasKey()){toast('Add your free Gemini key in Settings first');return}toast('Reading with AI…');try{await reread(R.find(x=>x.id===id));toast('Read – check the details');openRec(id);render()}catch(e){toast('Could not read: '+e.message)}}
const closeM=()=>$('#modal').className='';
async function saveRec(id){const r=R.find(x=>x.id===id),o={...r},x=X(r);x.c=$('#m5').value;x.m=textMeds($('#m6').value);x.s=$('#m7').value.trim();x.f=$('#m8').value.trim();Object.assign(r,{title:$('#m1').value.trim()||r.title,date:$('#m2').value,sec:$('#m3').value,note:pack($('#m4').value.trim(),x)});try{await api({a:'upd',id,sec:r.sec,title:r.title,date:r.date,note:r.note});snap();closeM();render();toast('Saved')}catch(e){Object.assign(r,o);toast('Not saved: '+e.message)}}
async function delRec(id){if(!confirm('Delete this record and its file?'))return;try{await api({a:'del',id});const r=R.find(x=>x.id===id);tx('readwrite',s=>s.delete(r.fid));R=R.filter(x=>x.id!==id);snap();closeM();render()}catch(e){toast('Not deleted: '+e.message)}}
(async()=>{if(location.hash.indexOf('#setup=')===0){try{setupApply(location.hash);history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>toast('Setup loaded – you are all set'),900)}catch(e){setTimeout(()=>toast('That setup link is not valid'),900)}}await cfgRestore();const s=JSON.parse(localStorage.getItem('snap')||'{}');R=s.R||[];card=s.card||{};render();if(cfg.url&&cfg.pin){await load();render()}else cur='set',render()})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
