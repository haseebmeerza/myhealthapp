<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3d6e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Health App">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Health App</title>
<style>
:root{--b:#0f3d6e;--b2:#1f6fb5;--bg:#f3f6fa;--ln:#d5deea;--tx:#17283d;--mu:#5d6f86;--red:#b3261e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,'Segoe UI',Roboto,sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
header{flex:none;background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--b);display:grid;place-items:center;font-weight:700;font-size:1.25rem;flex:none}
header h1{margin:0;font-size:1.15rem;line-height:1.2}header small{display:block;opacity:.88;font-size:.82rem}
.chip{margin-left:auto;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:4px 12px;font-size:.8rem;text-align:center}
.wrap{flex:1;display:flex;min-height:0}
nav{width:236px;flex:none;background:#fff;border-right:1px solid var(--ln);overflow-y:auto;padding:6px 0}
nav button{display:flex;width:100%;gap:10px;align-items:center;padding:11px 16px;border:0;border-left:4px solid transparent;background:none;font:inherit;color:var(--tx);text-align:left;cursor:pointer}
nav button.on{background:#e8f0fa;border-left-color:var(--b2);font-weight:600;color:var(--b)}
nav button.sos{color:var(--red);font-weight:700}nav button.sos.on{background:#fdecea;border-left-color:var(--red)}
nav .ic{width:22px;text-align:center;flex:none}nav .sh{display:none}nav .n{margin-left:auto;font-size:.75rem;color:var(--mu)}
nav hr{border:0;border-top:1px solid var(--ln);margin:6px 0}
main{flex:1;min-width:0;overflow-y:auto;padding:16px 18px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.bar h2{margin:0 auto 0 0;font-size:1.25rem;color:var(--b)}
.btn{background:var(--b2);color:#fff;border:1px solid var(--b2);border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:#fff;color:var(--b);border-color:var(--ln)}.btn.r{background:#fff;color:var(--red);border-color:var(--red)}
.auto{font-size:.85rem;color:var(--mu);display:flex;gap:6px;align-items:center;flex-direction:row;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--ln);border-radius:6px;overflow:hidden;cursor:pointer}
.card .th{height:130px;background:#e8eef6;display:grid;place-items:center;color:var(--b);font-weight:700;font-size:1.3rem}
.card .th img{width:100%;height:100%;object-fit:cover}
.card .in{padding:8px 10px;border-top:1px solid var(--ln)}.card b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--mu);font-size:.78rem}
.empty{border:2px dashed var(--ln);background:#fff;border-radius:6px;padding:28px;color:var(--mu);text-align:center}
.warn{background:#fff7e0;border:1px solid #e6c458;border-radius:6px;padding:12px 14px;margin-bottom:14px}
.mu{color:var(--mu);font-size:.85rem}
.form{max-width:520px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.88rem}
input[type=text],input[type=date],input[type=password],select,textarea{font:inherit;border:1px solid var(--ln);border-radius:6px;padding:9px 10px;background:#fff;color:var(--tx);width:100%}
/* emergency card sheet */
.sheet{background:#fff;border:2px solid var(--red);border-radius:6px;max-width:820px}
.sheet h3{margin:0;background:var(--red);color:#fff;padding:10px 16px;font-size:1.1rem}
.sheet h4{margin:0;padding:6px 16px;background:#f3f6fa;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);font-size:.9rem;color:var(--b)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;padding:8px 16px}.kv span{color:var(--mu)}.kv b{font-weight:600;word-break:break-word}
.sheet table{width:calc(100% - 32px);margin:8px 16px;border-collapse:collapse;font-size:.9rem}
.sheet th,.sheet td{border:1px solid var(--ln);padding:5px 8px;text-align:left}.sheet th{background:#f3f6fa}
.sheet a{color:var(--b2)}
#modal{position:fixed;inset:0;background:rgba(10,30,60,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}#modal.on{display:flex}
.box{background:#fff;border-radius:8px;width:min(900px,100%);max-height:94vh;overflow:auto}
.box h3{margin:0;padding:10px 16px;background:var(--b);color:#fff;font-size:1.05rem}.box .mb{padding:14px 16px;display:grid;gap:12px}
.box .pv{background:#e8eef6;border:1px solid var(--ln);text-align:center;min-height:80px;display:grid;place-items:center;color:var(--mu)}.box .pv canvas{max-width:100%;height:auto;margin-bottom:6px}.box .pv img{max-width:100%;max-height:60vh}.box .pv iframe{width:100%;height:60vh;border:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--b);color:#fff;padding:9px 18px;border-radius:99px;display:none;z-index:30;max-width:92vw;text-align:center}
@media(max-width:700px){
nav{width:70px}nav button{flex-direction:column;gap:2px;padding:10px 2px;border-left-width:3px;text-align:center;font-size:.62rem;line-height:1.1}
nav .full,nav .n{display:none}nav .sh{display:block}nav .ic{font-size:1.2rem}
.chip{display:none}main{padding:12px}.row2{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:105px 1fr}}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dc{background:#fff;border:1px solid var(--ln);border-radius:6px;padding-top:10px}.dc>b,.dc>.mu{display:block;padding:0 16px}.dc .kv{grid-template-columns:70px 1fr}
.rh{margin:12px 0 4px;color:var(--b)}.res{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:14px 16px;max-width:820px;overflow-wrap:anywhere}
@media print{header,nav,.bar,#toast,footer{display:none!important}body{display:block;overflow:visible;background:#fff}.wrap,main{display:block;overflow:visible;padding:0}.sheet{border:1px solid #000;max-width:none}.sheet h3{background:#fff;color:#000;border-bottom:2px solid #000}}
footer{flex:none;background:#fff;border-top:1px solid var(--ln);padding:5px 12px calc(5px + env(safe-area-inset-bottom));font-size:.72rem;color:var(--mu);display:flex;gap:12px;align-items:center;white-space:nowrap;overflow:hidden;cursor:pointer}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#9aa7b8}.dot.ok{background:#1a9b4b}.dot.bad{background:#c62828}.dot.q{background:#e0a100}
</style></head><body>
<header><div class="av" id="av"></div><div><h1 id="hn"></h1><small id="ha"></small></div><div class="chip" id="hd"></div></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<footer id="ft" onclick="go('set')"></footer>
<input id="fs" type="file" accept="image/*" capture="environment" hidden>
<input id="fu" type="file" accept="image/*,application/pdf" multiple hidden>
<div id="modal"></div><div id="toast"></div>
<script>
const APPV='v11';
let conn={sheet:'off',drive:'off',info:null,msg:''};
const SEC=[['dx','Diagnosis','🩺','Diagnosis'],['first','First Report','📄','First'],['treat','Treatment Reports','💊','Treatment'],['rx','Prescriptions','℞','Rx'],['img','CT Scans & MRIs','🧠','CT / MRI'],['uae','Doctor Consults – UAE','🇦🇪','UAE'],['pk','Doctor Consults – Pakistan','🇵🇰','Pakistan'],['o1','Others 1','📁','Other 1'],['o2','Others 2','📁','Other 2'],['o3','Others 3','📁','Other 3']];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(d||'');return m?m[3]+'-'+MON[+m[2]-1]+'-'+m[1]:'No date'};
let cfg={name:'Mominah Haseeb Mirza',dx:'Craniopharyngioma',dob:'',gkey:'',aiok:false,url:'',pin:'',names:{},auto:false,...JSON.parse(localStorage.getItem('cfg')||'{}')};
const sv=()=>localStorage.setItem('cfg',JSON.stringify(cfg)),sn=id=>cfg.names[id]||SEC.find(s=>s[0]===id)[1];
let R=[],card={},cur='card',edit=false,U={};
/* online storage: Google Sheet + Drive through your Apps Script */
async function api(b){if(!cfg.url||!cfg.pin)throw new Error('Add the server link and PIN in Settings');const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({...b,pin:cfg.pin})}),j=await r.json();if(j.error)throw new Error(j.error);return j}
const snap=()=>{try{localStorage.setItem('snap',JSON.stringify({R,card}))}catch(e){}};
async function load(){try{const j=await api({a:'list'});R=j.recs;card=j.card||{};snap()}catch(e){const s=JSON.parse(localStorage.getItem('snap')||'{}');R=s.R||[];card=s.card||{};if(cfg.url)toast('Could not reach online storage – showing the last saved copy')}}
/* files cached on this device only to open faster */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('medrec-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('c',{keyPath:'fid'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(mode,fn)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction('c',mode),q=fn(t.objectStore('c'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
async function getBlob(r){const h=await tx('readonly',s=>s.get(r.fid));if(h)return h.blob;const j=await api({a:'file',fid:r.fid}),bin=atob(j.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const blob=new Blob([u],{type:r.type});await tx('readwrite',s=>s.put({fid:r.fid,blob}));return blob}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}
function age(){if(!cfg.dob)return 'Age: add date of birth in Settings';const d=new Date(cfg.dob),n=new Date();let m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())m--;return 'Age: '+Math.floor(m/12)+' years '+m%12+' months · Born '+fd(cfg.dob)}
function foot(){const d=k=>`<span class="dot ${conn[k]==='ok'?'ok':conn[k]==='bad'?'bad':'q'}"></span>`,st=k=>({ok:'connected',bad:'not connected','?':'not checked',off:'not set up'}[conn[k]]);$('#ft').innerHTML=`<b>${APPV}</b><span>${d('sheet')}Sheet ${st('sheet')}</span><span>${d('drive')}Drive ${st('drive')}</span><span><span class="dot ${cfg.gkey&&cfg.aiok?'ok':'q'}"></span>AI ${cfg.gkey&&cfg.aiok?'on':'off'}</span><span style="margin-left:auto;overflow:hidden;text-overflow:ellipsis">Designed by Haseeb Mirza +971 50 725 6801</span>`}
async function checkConn(){if(!cfg.url||!cfg.pin){conn={sheet:'off',drive:'off',info:null,msg:''};foot();if(cur==='set')render();return}
const why=m=>/Failed to fetch|NetworkError|Load failed/i.test(m)?'Cannot reach the link. Check the internet, and that the script is deployed with access set to Anyone.':/wrong PIN/i.test(m)?'The PIN does not match the one in the Google script.':m;
try{const j=await api({a:'ping'});conn={sheet:'ok',drive:'ok',info:j,msg:''}}catch(e){if(/unknown action/i.test(e.message)){try{await api({a:'list'});conn={sheet:'ok',drive:'?',info:null,msg:'Paste the newest Code.gs into Apps Script and deploy a new version to also check Drive.'}}catch(e2){conn={sheet:'bad',drive:'bad',info:null,msg:why(e2.message)}}}else conn={sheet:'bad',drive:'bad',info:null,msg:why(e.message)}}foot();if(cur==='set')render()}
function connBox(){const i=conn.info||{},lab={ok:'✅ Connected',bad:'❌ Not connected',off:'⚪ Not set up','?':'🟡 Not checked'},lk=(t,u)=>t?' – '+(u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t)):'',row=(l,v)=>`<span>${l}</span><b>${v}</b>`;
return `<div class="sheet" style="border-color:var(--ln)"><h4>Google connection</h4><div class="kv">${row('Google Sheet',lab[conn.sheet]+lk(i.sheet,i.sheetUrl))}${row('Drive folder',lab[conn.drive]+lk(i.folder,i.folderUrl))}${i.records!=null?row('Saved',i.records+' records · '+i.files+' files'):''}${conn.msg?row('Note',esc(conn.msg)):''}</div><div style="padding:0 16px 12px"><button class="btn g" onclick="toast('Testing…');checkConn()">🔌 Test connection</button></div></div>`}
function head(){foot();$('#av').textContent=(cfg.name||'?')[0].toUpperCase();$('#hn').textContent=cfg.name;$('#ha').textContent=age();$('#hd').textContent=cfg.dx||'';$('#hd').hidden=!cfg.dx;document.title=cfg.name+" – My Health App"}
function nav(){const b=(id,ic,full,sh,n,x='')=>`<button class="${x} ${cur===id?'on':''}" onclick="go('${id}')"><span class="ic">${ic}</span><span class="full">${esc(full)}</span><span class="sh">${esc(sh)}</span>${n!=null?`<span class="n">${n}</span>`:''}</button>`;
$('#nav').innerHTML=b('card','🚑','Emergency Card','SOS',null,'sos')+'<hr>'+b('all','🗂','All records (timeline)','All',R.length)+b('idx','📑','Index & Summary','Index')+'<hr>'+SEC.map(s=>b(s[0],s[2],sn(s[0]),cfg.names[s[0]]||s[3],R.filter(r=>r.sec===s[0]).length)).join('')+'<hr>'+b('dir','🏥','Doctors & Hospitals – Lahore','Lahore Dr')+b('res','🔬','International Research','Research')+b('set','⚙','Settings','Settings')}
function go(id){cur=id;edit=false;render();$('#main').scrollTop=0}
const isPdf=r=>r.type==='application/pdf';
function render(){head();nav();$('#main').innerHTML=cur==='set'?settings():cur==='dir'?dirView():cur==='res'?resView():cur==='idx'?idxView():cur==='card'?(edit?cardForm():cardView()):view()}
function view(){const L=R.filter(r=>cur==='all'||r.sec===cur).sort((a,b)=>(a.date||'').localeCompare(b.date||'')),t=cur==='all'?'All records — oldest first':sn(cur);
return (cfg.url&&cfg.pin?'':`<div class="warn"><b>Online storage is not connected yet.</b> Open Settings and add the server link and PIN from your Google Apps Script.</div>`)+`<div class="bar"><h2>${esc(t)}</h2><label class="auto"><input type="checkbox" ${cfg.auto?'checked':''} onchange="cfg.auto=this.checked;sv()"> Auto-sort with AI</label>${cur[0]==='o'&&cur!=='all'?'<button class="btn g" onclick="renameSec()">Rename</button>':''}<button class="btn g" onclick="$('#fs').click()">📷 Scan</button><button class="btn" onclick="$('#fu').click()">＋ Upload images / PDFs</button></div>`+
(cur==='pk'?pkStrip():'')+(L.length?`<div class="grid">${L.map(r=>`<div class="card" onclick="openRec('${r.id}')"><div class="th">${r.thumb?`<img src="${r.thumb}" alt="">`:isPdf(r)?'PDF':'🖼'}</div><div class="in"><b>${esc(r.title)}</b><small>${fd(r.date)}${cur==='all'?' · '+esc(sn(r.sec)):''}</small></div></div>`).join('')}</div>`:`<div class="empty">No records here yet.<br>Tap <b>Scan</b> to photograph a page, or <b>Upload</b> to add many images and PDFs at once.</div>`)}
function renameSec(){const v=(prompt('New name for this section',sn(cur))||'').trim();if(v){cfg.names[cur]=v;sv();render()}}
/* emergency card */
const CF=[['birth','Place of birth'],['nic','CNIC / B-Form number'],['blood','Blood group'],['wt','Weight (kg) – update often'],['allergies','Allergies'],['alert','Medical alerts for emergency staff'],['hosp','Main treating hospital and file / MRN number'],['dxd','Diagnosis details (date, hospital)'],['father',"Father's name"],['fphone',"Father's phone"],['mother',"Mother's name"],['mphone',"Mother's phone"],['rel','Another emergency contact (name and phone)'],['home','Home address'],['loc','Home location (Google Maps link)'],['school','School name'],['saddr','School address'],['sphone','School phone'],['note','Other important notes']];
const lines=t=>(t||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.split('|').map(s=>s.trim()));
const tel=p=>p?`<a href="tel:${esc(p.replace(/[^+\d]/g,''))}">${esc(p)}</a>`:'—';
const kv=(k,v)=>`<span>${k}</span><b>${v||'—'}</b>`;
function tbl(head,rows,phoneCol){return rows.length?`<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${head.map((h,i)=>`<td>${i===phoneCol?tel(r[i]):esc(r[i]||'')}</td>`).join('')}</tr>`).join('')}</table>`:`<div class="kv"><span>—</span></div>`}
function cardView(){const c=card,loc=/^https?:/.test(c.loc||'')?`<a href="${esc(c.loc)}" target="_blank">Open in Maps</a>`:esc(c.loc);
return `<div class="bar"><h2>Emergency Card</h2><button class="btn g" onclick="edit=true;render()">Edit</button><button class="btn" onclick="window.print()">Print / Save as PDF</button></div>
<div class="sheet"><h3>EMERGENCY MEDICAL CARD</h3>
<h4>Patient</h4><div class="kv">${kv('Name',esc(cfg.name))}${kv('Date of birth',cfg.dob?fd(cfg.dob):'')}${kv('Age',esc(age().replace('Age: ','').replace(/ · Born.*/,'')))}${kv('Place of birth',esc(c.birth))}${kv('CNIC / B-Form',esc(c.nic))}${kv('Diagnosis',esc(cfg.dx))}${kv('Details',esc(c.dxd))}${kv('Blood group',esc(c.blood))}${kv('Weight',c.wt?esc(c.wt)+' kg':'')}${kv('Allergies',esc(c.allergies))}${kv('Medical alerts',esc(c.alert).replace(/\n/g,'<br>'))}${kv('Main hospital',esc(c.hosp))}</div>
<h4>Current medicines</h4>${tbl(['Medicine','Dose','When'],lines(c.meds))}
<h4>Doctors who have checked her</h4>${tbl(['Doctor','Hospital / country','Phone'],lines(c.docs),2)}
<h4>Parents</h4><div class="kv">${kv('Father',esc(c.father))}${kv('Father phone',tel(c.fphone))}${kv('Mother',esc(c.mother))}${kv('Mother phone',tel(c.mphone))}${kv('Other contact',esc(c.rel))}</div>
<h4>Home and school</h4><div class="kv">${kv('Home',esc(c.home))}${kv('Home location',loc)}${kv('School',esc(c.school))}${kv('School address',esc(c.saddr))}${kv('School phone',tel(c.sphone))}</div>
<h4>Other notes</h4><div class="kv">${kv('Notes',esc(c.note).replace(/\n/g,'<br>'))}</div></div>
<p class="mu">Last saved copy stays readable on this phone even without internet.</p>`}
function cardForm(){return `<div class="bar"><h2>Edit Emergency Card</h2></div><div class="form">${CF.map(([k,l])=>`<label>${l}${['note','alert'].includes(k)?`<textarea id="c_${k}" rows="3">${esc(card[k])}</textarea>`:`<input type="text" id="c_${k}" value="${esc(card[k])}">`}</label>`).join('')}
<label>Current medicines – one per line: Medicine | Dose | When<textarea id="c_meds" rows="6" placeholder="Hydrocortisone | 5 mg | Morning">${esc(card.meds)}</textarea></label>
<label>Doctors – one per line: Name | Hospital / country | Phone<textarea id="c_docs" rows="5" placeholder="Dr Name | Hospital, UAE | +971...">${esc(card.docs)}</textarea></label>
<div class="bar" style="border:0"><button class="btn" onclick="saveCard()">Save card</button><button class="btn g" onclick="edit=false;render()">Cancel</button></div></div>`}
async function saveCard(){CF.forEach(([k])=>card[k]=$('#c_'+k).value.trim());card.meds=$('#c_meds').value.trim();card.docs=$('#c_docs').value.trim();snap();edit=false;render();try{await api({a:'card',card});toast('Emergency card saved online')}catch(e){toast('Saved on this phone only: '+e.message)}}
function settings(){return `<div class="bar"><h2>Settings</h2></div><div class="form"><label>Patient name<input type="text" id="s1" value="${esc(cfg.name)}"></label><label>Date of birth<input type="date" id="s2" value="${esc(cfg.dob)}"></label><label>Diagnosis shown in header<input type="text" id="s3" value="${esc(cfg.dx)}"></label>
<label>Server link (Apps Script web app URL)<input type="text" id="s5" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Server PIN<input type="password" id="s6" value="${esc(cfg.pin)}"></label>
<label>Gemini API key (free, from aistudio.google.com – only for AI features)<input type="password" id="s4" value="${esc(cfg.gkey)}" placeholder="AIza..."></label><label class="auto" style="align-items:flex-start;line-height:1.35"><input type="checkbox" id="s7" ${cfg.aiok?'checked':''}> <span>I understand that on the free Gemini plan Google may use what is sent (reports, scans, the case summary) to improve its products, and reviewers may read it. Google advises not to send sensitive personal data to the free plan. AI features stay off until this is ticked.</span></label><button class="btn g" onclick="testGem()">🤖 Test AI key</button>${connBox()}<button class="btn" onclick="saveSet()">Save settings</button><button class="btn g" onclick="refreshApp()">🔄 Update app now</button><p class="mu">App version ${APPV}. If a change on the website does not show here, tap Update app now.</p>
<p class="mu">Records and files are saved online in your Google Drive folder and Google Sheet, so every phone with this link and PIN sees the same data. The PIN and AI key are stored on each device. When AI is on, the files you auto-sort or analyse are sent to Google's Gemini.</p></div>`}

return `<div class="warn">AI reads the files and writes a plain summary from what the reports and prescriptions say. It does not look at scan pictures like a doctor and it can misread handwriting. Use it to prepare questions, and let her doctors decide. Needs the API key in Settings. Reads up to the 12 newest files; PDFs over 8 MB are skipped.</div><div class="bar" style="border:0;padding:0;margin:0 0 10px"><button class="btn" onclick="runAn('scans')">🧠 Analyse CT &amp; MRI scans</button><button class="btn" onclick="runAn('rx')">℞ Analyse prescriptions</button></div><div class="mu" id="as"></div>${one('scans','CT &amp; MRI analysis')}${one('rx','Prescription analysis')}${!A.scans&&!A.rx?'<div class="empty">Nothing yet. Tap a button above.</div>':''}`}
function idxView(){const T=[['rx','Prescriptions'],['ct','CT scans'],['mri','MRI scans'],['meds','Medicines'],['an','Analysis']];
const body=itab==='meds'?imedsView():itab==='an'?ianView():irows(R.filter(IF[itab]));
return `<div class="bar"><h2>Index &amp; Summary</h2><button class="btn g" onclick="window.print()">Print</button></div><div class="bar" style="border:0;padding:0;margin:0 0 12px">${T.map(([k,l])=>`<button class="btn ${itab===k?'':'g'}" onclick="itab='${k}';render()">${l}</button>`).join('')}</div>${body}`}
async function filePart(r,st){const b=await getBlob(r);if(r.type==='application/pdf'){if(b.size>8e6)return null;return{type:'document',source:{type:'base64',media_type:'application/pdf',data:await b64(b)}}}try{return{type:'image',source:{type:'base64',media_type:'image/jpeg',data:(await img(b,1400,.75)).split(',')[1]}}}catch(e){return null}}
const AP=k=>k==='rx'?`These are the patient's prescriptions and doctor notes in date order (some handwritten). For EACH file give: date, doctor and hospital (from the letterhead), and every medicine with dose and how often as written; mark anything you cannot read clearly as "(unclear)" and never guess. Then give "Medicine list": every medicine ever prescribed with first date, last date and whether it is in the newest prescription. Then "Changes over time": medicines started, stopped, or dose changed between prescriptions. Finish with "Check with the doctor or pharmacist": 3-5 bullets (for example unclear names, possible brand and generic duplicates). Do not advise changing any medicine. Plain English, short bullets, under 700 words.`:`These are the patient's CT and MRI files in date order (written reports or film images). The patient is a child with ${cfg.dx||'a brain tumour'}. For EACH file give: date, scan type and body part, the place if printed, and the key findings and impression exactly as the radiologist's written report says, including any measurements with units. If a file has no written report, say "no written report – images only" and do not interpret the pictures. Then write "Changes over time": a short plain-English comparison of what the reports say changed between scans, only from what is written; say "not stated" where they do not say. Finish with "Questions to ask her doctor" (3-5 bullets). You are not diagnosing. Plain English, short bullets, under 700 words.`;
async function runAn(kind){if(!cfg.gkey){toast('Add the Gemini API key in Settings first');return}
const L=R.filter(kind==='rx'?isRx:r=>IF.ct(r)||isMRI(r)).sort(byDate).slice(-12),st=$('#as');if(!L.length){toast('No files to analyse yet');return}
const content=[],skipped=[];let tot=0;
for(let i=0;i<L.length;i++){const r=L[i];st.textContent='Reading file '+(i+1)+' of '+L.length+'…';let p=null;try{p=await filePart(r)}catch(e){}
if(p&&tot+(p.source.data.length)>2e7)p=null;if(!p){skipped.push(r.title);continue}tot+=p.source.data.length;
content.push({type:'text',text:'FILE '+(i+1)+': "'+r.title+'", date '+fd(r.date)+', section '+sn(r.sec)+(docOf(r)?', doctor '+docOf(r):'')},p)}
if(!content.length){st.textContent='Could not read any file (PDFs over 8 MB are skipped).';return}
content.push({type:'text',text:AP(kind)});st.textContent='Analysing '+(L.length-skipped.length)+' file(s)… about a minute.';
try{let text=(await gem(content,{max:8192})).slice(0,4000);
if(skipped.length)text+='\n\nNot read (too large or unreadable): '+skipped.join(', ');
card._an=card._an||{};card._an[kind]={date:new Date().toISOString().slice(0,10),text};render();pc()}catch(e){st.textContent='Analysis failed: '+e.message}}

/* first-time patient details */
const SEED={name:'Mominah Haseeb Mirza',dob:'2012-07-31',card:{birth:'Lahore',father:'Haseeb Mirza',fphone:'0345-2104860',mother:'Maria Haseeb Mirza',mphone:'0331-8696222',school:'7Cs School',saddr:'Gulshan-e-Ravi, Lahore'}};
function seed(){if(card._seed)return;if(cfg.name==='Momina Haseeb')cfg.name=SEED.name;if(!cfg.dob)cfg.dob=SEED.dob;sv();for(const k in SEED.card)if(!card[k])card[k]=SEED.card[k];card._seed=1;snap();if(cfg.url&&cfg.pin)pc()}
/* add files */
const guess=n=>{n=n.toLowerCase();return /mri|\bct\b|scan|x-?ray/.test(n)?'img':/presc|\brx\b/.test(n)?'rx':/uae|dubai|abu.?dhabi|sharjah/.test(n)?'uae':/diagnos/.test(n)?'dx':/first|initial/.test(n)?'first':/lab|treat|surgery|radio/.test(n)?'treat':null};
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
async function img(f,max,q){const bm=await createImageBitmap(f),k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
const PROMPT='This file is part of the medical records of a patient with craniopharyngioma. Choose exactly one section id: dx = diagnosis letters or summaries; first = the first or initial reports from when the illness began; treat = surgery, radiotherapy, hospital treatment, lab and follow-up reports; rx = prescriptions and medicine lists; img = CT, MRI or X-ray reports and films; uae = doctor consultations or hospital notes from the UAE; pk = doctor consultations or hospital notes from Pakistan; o1 = anything else. If this is a prescription, doctor note or hospital paper (it may be handwritten), read the printed letterhead or stamp and also give "doctor":{"name":"","qualification":"","hospital":"","phone":"","address":""} using only what is clearly visible (empty strings otherwise, never guess), and "meds":"medicine names you can clearly read, or empty". Reply with JSON only: {"section":"id","title":"short title","date":"YYYY-MM-DD of the document or empty","summary":"one line","doctor":{},"meds":""}';
/* Google Gemini (free key from aistudio.google.com). Callers pass Anthropic-style blocks; they are converted here. */
const GB='https://generativelanguage.googleapis.com/v1beta/';
const toGem=bl=>bl.map(b=>b.type==='text'?{text:b.text}:{inline_data:{mime_type:b.source.media_type,data:b.source.data}});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gauto(){try{const r=await fetch(GB+'models?pageSize=200',{headers:{'x-goog-api-key':cfg.gkey}}),j=await r.json();return(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/^models\/gemini-/.test(m.name)&&/flash/.test(m.name)&&!/image|tts|audio|live|native|embed|robot|computer|vision|exp/.test(m.name)).map(m=>m.name.slice(7)).sort((a,b)=>(/lite/.test(a)-/lite/.test(b))||(/preview/.test(a)-/preview/.test(b))||b.localeCompare(a))}catch(e){return[]}}
async function gem(blocks,o={}){if(!cfg.gkey)throw new Error('Add the Gemini API key in Settings first');if(!cfg.aiok)throw new Error('Tick the AI privacy box in Settings first');
const body={contents:[{role:'user',parts:toGem(blocks)}],generationConfig:{maxOutputTokens:o.max||8192,temperature:.2}};
if(o.search)body.tools=[{google_search:{}}];else if(o.json)body.generationConfig.responseMimeType='application/json';
const c=[];[cfg.gmodel,localStorage.getItem('gok'),'gemini-flash-latest'].forEach(m=>{if(m&&!c.includes(m))c.push(m)});
let last='',listed=false,waited=false;
for(let i=0;i<c.length;i++){let r,j;
try{r=await fetch(GB+'models/'+c[i]+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':cfg.gkey},body:JSON.stringify(body)});j=await r.json()}catch(e){throw new Error('Cannot reach Google. Check the internet.')}
if(r.ok){const cd=(j.candidates||[])[0]||{},t=((cd.content||{}).parts||[]).map(p=>p.text||'').join('').trim();
if(!t)throw new Error(j.promptFeedback&&j.promptFeedback.blockReason?'Google blocked this content ('+j.promptFeedback.blockReason+')':'Empty answer ('+(cd.finishReason||'no reason given')+')');
localStorage.setItem('gok',c[i]);let src='';const ch=((cd.groundingMetadata||{}).groundingChunks||[]).map(x=>x.web).filter(Boolean);
if(o.search&&ch.length){const seen=new Set();src='\n\nSources:\n'+ch.filter(w=>!seen.has(w.uri)&&seen.add(w.uri)).slice(0,8).map(w=>'- '+(w.title||'source')+' '+w.uri).join('\n')}
return t+src}
const msg=(j&&j.error&&j.error.message)||('HTTP '+r.status);last=msg;
if(r.status===401||r.status===403||(r.status===400&&/API key/i.test(msg)))throw new Error('Gemini key problem: '+msg);
if(r.status===429&&!/per ?day|daily/i.test(JSON.stringify(j))&&!waited){waited=true;await sleep(25000);i--;continue}
if([400,404,429,500,503].includes(r.status)){if(i===c.length-1&&!listed){listed=true;for(const a of await gauto())if(!c.includes(a))c.push(a)}continue}
throw new Error(msg)}
throw new Error(last||'Gemini did not answer')}
async function testGem(){const k=$('#s4').value.trim();if(!k){toast('Paste the Gemini key first');return}cfg.gkey=k;cfg.aiok=$('#s7').checked;sv();if(!cfg.aiok){toast('Tick the privacy box first');return}toast('Testing…');try{await gem([{type:'text',text:'Reply with the single word OK'}],{max:256});toast('✅ AI key works ('+(localStorage.getItem('gok')||'')+')');foot()}catch(e){toast('❌ '+e.message)}}
async function ai(f,type){const block=type==='application/pdf'?{type:'document',source:{type:'base64',media_type:type,data:await b64(f)}}:{type:'image',source:{type:'base64',media_type:'image/jpeg',data:(await img(f,1600,.85)).split(',')[1]}};
const t=await gem([block,{type:'text',text:PROMPT}],{json:true});return JSON.parse(t.match(/\{[\s\S]*\}/)[0])}
async function addFiles(fl){fl=[...fl];if(!fl.length)return;if(!cfg.url||!cfg.pin){toast('Connect online storage in Settings first');return}
const useAI=cfg.auto&&cfg.gkey&&cfg.aiok;let n=0,ok=0,badAI=0,dd=0,fail='';
if(cfg.auto&&!(cfg.gkey&&cfg.aiok))toast('AI is off (add the Gemini key and tick the privacy box): sorting by section and file name');
for(const f of fl){toast('Saving '+(++n)+' of '+fl.length+(useAI?' (AI reading)…':'…'));const type=f.type||(/\.pdf$/i.test(f.name)?'application/pdf':'image/jpeg');let g={};
if(useAI){try{g=await ai(f,type)}catch(e){badAI++}}
const sec=SEC.some(s=>s[0]===g.section)?g.section:(!['all','set','card','dir','res','idx'].includes(cur)?cur:(guess(f.name)||'o1'));
const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),sec,title:g.title||f.name.replace(/\.[^.]+$/,''),date:/^\d{4}-\d\d-\d\d$/.test(g.date||'')?g.date:new Date(f.lastModified||Date.now()).toISOString().slice(0,10),note:(g.summary||'')+(g.meds?' | Medicines (AI-read, check the original): '+g.meds:''),type,name:f.name,thumb:''};
try{let data,blob=f;
if(type==='application/pdf')data=await b64(f);else{try{const full=await img(f,2400,.9);data=full.split(',')[1];r.thumb=await img(f,260,.6);r.type=type='image/jpeg';blob=await (await fetch(full)).blob()}catch(e){data=await b64(f)}}
const j=await api({a:'add',...r,data});r.fid=j.fid;await tx('readwrite',s=>s.put({fid:r.fid,blob}));R.push(r);ok++;if(logDoc(g.doctor,r))dd++}catch(e){fail=e.message}}
if(dd)await pc();snap();render();toast(ok+' of '+fl.length+' saved online'+(dd?' · '+dd+' doctor(s) updated in My doctors':'')+(fail?' · error: '+fail:'')+(badAI?' · '+badAI+' not read by AI':''))}
$('#fu').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#fs').onchange=e=>{addFiles(e.target.files);e.target.value=''};
/* PDF preview (Android cannot show PDFs inside a page, so draw the pages) */
let PJ;async function pdfjs(){if(PJ)return PJ;const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await new Promise((ok,no)=>{const x=document.createElement('script');x.src=B+'pdf.min.js';x.crossOrigin='anonymous';x.onload=ok;x.onerror=no;document.head.appendChild(x)});const w=await(await fetch(B+'pdf.worker.min.js')).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));return PJ=pdfjsLib}
async function showPdf(blob,el){try{const L=await pdfjs(),d=await L.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;el.innerHTML='';const n=Math.min(d.numPages,30);for(let i=1;i<=n;i++){const pg=await d.getPage(i),vp=pg.getViewport({scale:1.4}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;el.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}if(d.numPages>n)el.insertAdjacentHTML('beforeend','<p class="mu">Showing the first 30 pages.</p>')}catch(e){el.innerHTML='<iframe src="'+URL.createObjectURL(blob)+'"></iframe><p class="mu">Preview not available here. Use Open / download.</p>'}}
/* open / edit */
async function openRec(id){const r=R.find(x=>x.id===id);
$('#modal').innerHTML=`<div class="box"><h3>${esc(r.title)}</h3><div class="mb"><div class="pv" id="pv">Loading file…</div><div class="row2"><label>Title<input type="text" id="m1" value="${esc(r.title)}"></label><label>Date<input type="date" id="m2" value="${esc(r.date)}"></label></div><label>Section<select id="m3">${SEC.map(s=>`<option value="${s[0]}" ${s[0]===r.sec?'selected':''}>${esc(sn(s[0]))}</option>`).join('')}</select></label><label>Notes<textarea id="m4" rows="3">${esc(r.note)}</textarea></label><div class="bar" style="border:0;margin:0;padding:0"><button class="btn" onclick="saveRec('${id}')">Save</button><a class="btn g" id="dl" style="text-decoration:none" target="_blank">Open / download</a><button class="btn g" onclick="closeM()">Close</button><button class="btn r" style="margin-left:auto" onclick="delRec('${id}')">Delete</button></div></div></div>`;$('#modal').className='on';
try{const b=await getBlob(r),u=U[r.fid]||(U[r.fid]=URL.createObjectURL(b));if(!$('#pv'))return;if(isPdf(r))await showPdf(b,$('#pv'));else $('#pv').innerHTML=`<img src="${u}" alt="">`;$('#dl').href=u;$('#dl').download=r.name}catch(e){if($('#pv'))$('#pv').textContent='Could not load the file: '+e.message}}
const closeM=()=>$('#modal').className='';
async function saveRec(id){const r=R.find(x=>x.id===id),o={...r};Object.assign(r,{title:$('#m1').value.trim()||r.title,date:$('#m2').value,sec:$('#m3').value,note:$('#m4').value});try{await api({a:'upd',id,sec:r.sec,title:r.title,date:r.date,note:r.note});snap();closeM();render();toast('Saved')}catch(e){Object.assign(r,o);toast('Not saved: '+e.message)}}
async function delRec(id){if(!confirm('Delete this record and its file?'))return;try{await api({a:'del',id});const r=R.find(x=>x.id===id);tx('readwrite',s=>s.delete(r.fid));R=R.filter(x=>x.id!==id);snap();closeM();render()}catch(e){toast('Not deleted: '+e.message)}}
(async()=>{const s=JSON.parse(localStorage.getItem('snap')||'{}');R=s.R||[];card=s.card||{};seed();render();if(cfg.url&&cfg.pin){await load();seed();render();checkConn()}else cur='set',render()})();
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}))}
addEventListener('online',()=>checkConn());
async function refreshApp(){try{for(const k of await caches.keys())await caches.delete(k);for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch(e){}location.reload()}
