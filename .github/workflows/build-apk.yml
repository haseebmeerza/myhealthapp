name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create the Android project
        working-directory: apk
        run: |
          npm install
          npx cap add android
      - name: Camera permission and app icon
        working-directory: apk
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in icons/*; do cp "$d"/*.png "android/app/src/main/res/$(basename "$d")/"; done
      - name: Build the APK
        working-directory: apk
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish the APK as a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/android/app/build/outputs/apk/debug/app-debug.apk MyHealthApp.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest MyHealthApp.apk --title "My Health App (Android APK)" --notes "Download MyHealthApp.apk and install it on Android." --latest=false
